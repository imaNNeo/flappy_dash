<body>
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script>
    // One account for every game on games.imanneo.dev (its shared Nakama server, imaNNeo/games nakama/).
    // The app keeps its device id in SharedPreferences (localStorage "flutter.deviceId"). Served from
    // games.imanneo.dev/games/flappy-dash/, it shares that site's storage, so it takes the site's guest id
    // ("imanneo.deviceId", made here if this browser has none yet) and every game there is one account.
    // Framed by the portal from another address, it asks the play page for the id instead.
    (function () {
      var PORTAL = 'https://games.imanneo.dev', KEY = 'imanneo.deviceId', started = false;
      function use(id) {
        id = String(id || '');
        if (id.length >= 10 && id.length <= 128) try { localStorage.setItem('flutter.deviceId', JSON.stringify(id)); } catch (e) {}
      }
      function start() {
        if (started) return; started = true;
        window.removeEventListener('message', answer);
        var s = document.createElement('script'); s.src = 'flutter_bootstrap.js'; s.async = true; document.body.appendChild(s);
      }
      function answer(ev) {
        if (ev.origin !== PORTAL || !ev.data || ev.data.type !== 'imanneo.account') return;
        use(ev.data.deviceId);
        start();
      }
      if (location.origin === PORTAL) {
        try {
          var id = localStorage.getItem(KEY);
          if (!id) {
            var old = JSON.parse(localStorage.getItem('flutter.deviceId') || 'null');
            id = old || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
            localStorage.setItem(KEY, id);
          }
          use(id);
        } catch (e) {}
        return start();
      }
      if (window.parent === window) return start();
      window.addEventListener('message', answer);
      try { window.parent.postMessage({ type: 'imanneo.account.hello' }, PORTAL); } catch (e) {}
      setTimeout(start, 800); // not on the portal, or no answer: as before
    })();
  </script>
</body>
