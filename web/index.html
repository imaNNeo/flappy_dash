  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Other meta tags -->
  <meta property="og:title" content="Flappy Dash">
  <meta property="og:description" content="Flappy Dash brings the classic Flappy Bird gameplay with a twist! Control Flutter’s Dash mascot and compete with friends in real-time multiplayer for the highest score.">

  <!-- Umami player analytics (cookieless) -->
  <script defer src="https://stats.app2pack.dev/script.js" data-website-id="92ee569b-7158-4316-ba05-79984d2afe19" data-domains="play.flappydash.com"></script>
</head>
<body>
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script>
    // One account for every game on games.imanneo.dev (its shared Nakama server, imaNNeo/games nakama/).
    // Framed by the portal's play page, the game asks it for this browser's guest id first and signs in
    // with it (the app keeps its device id in SharedPreferences: localStorage "flutter.deviceId"), so
    // Flappy Dash and the other games there share one account. Elsewhere it starts as before.
    (function () {
      var PORTAL = 'https://games.imanneo.dev', started = false;
      function start() {
        if (started) return; started = true;
        window.removeEventListener('message', answer);
        var s = document.createElement('script'); s.src = 'flutter_bootstrap.js'; s.async = true; document.body.appendChild(s);
      }
      function answer(ev) {
        if (ev.origin !== PORTAL || !ev.data || ev.data.type !== 'imanneo.account') return;
        var id = String(ev.data.deviceId || '');
        if (id.length >= 10 && id.length <= 128) try { localStorage.setItem('flutter.deviceId', JSON.stringify(id)); } catch (e) {}
        start();
      }
      if (window.parent === window) return start();
      window.addEventListener('message', answer);
      try { window.parent.postMessage({ type: 'imanneo.account.hello' }, PORTAL); } catch (e) {}
      setTimeout(start, 800); // not on the portal, or no answer: as before
    })();
  </script>
</body>
</html>
