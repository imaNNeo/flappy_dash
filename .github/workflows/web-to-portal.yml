name: Web build to games portal

# Every push to main builds the web version of Flappy Dash and pushes it to the
# flappy-dash-web-update branch of imaNNeo/games. There a workflow opens a pull
# request that replaces client/games/flappy-dash/ and merges it, and the server
# pulls main every 5 minutes, so the new build goes live on
# games.imanneo.dev/games/flappy-dash/ by itself.
# Needs the PORTAL_DEPLOY_KEY secret (a write deploy key on imaNNeo/games) and
# NAKAMA_SERVER_KEY (the shared Nakama's server key, as for GitHub Pages).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: web-to-portal
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the PORTAL_DEPLOY_KEY secret is set
        env:
          PORTAL_DEPLOY_KEY: ${{ secrets.PORTAL_DEPLOY_KEY }}
        run: |
          if [ -z "$PORTAL_DEPLOY_KEY" ]; then
            echo "::error::PORTAL_DEPLOY_KEY is not set (a write deploy key on imaNNeo/games)."
            exit 1
          fi

      - name: Check out the games portal
        uses: actions/checkout@v4
        with:
          repository: imaNNeo/games
          ssh-key: ${{ secrets.PORTAL_DEPLOY_KEY }}
          path: .portal

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The portal owns the build script, so the web build always matches how
      # the portal serves it (base path, self-hosted CanvasKit).
      - name: Build the web version into the portal
        env:
          NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
        run: .portal/scripts/build-flappy-dash-web.sh "$GITHUB_WORKSPACE"

      - name: Read the version
        id: version
        run: |
          echo "name=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      # The portal's game-web-pr workflow turns this branch into a pull request and merges it.
      - name: Push the build to the portal's flappy-dash-web-update branch
        working-directory: .portal
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git add -A client/games/flappy-dash
          if git diff --cached --quiet; then
            echo "The web build is already up to date on the portal."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update Flappy Dash web build to $VERSION" -m "Built from $SOURCE"
          git push --force origin HEAD:refs/heads/flappy-dash-web-update
